<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardSync — Business Card Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e2e8f0;
    padding: 32px 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .container { max-width: 520px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; margin-bottom: 36px; }
  .header-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    margin-bottom: 16px; font-size: 26px;
  }
  .header h1 {
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { font-size: 14px; color: #64748b; margin-top: 6px; font-weight: 500; }

  /* Progress */
  .progress { display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
  .step-group { display: flex; align-items: center; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    background: #1e293b; border: 1.5px solid #334155; color: #475569;
    transition: all 0.3s;
  }
  .step-dot.active { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; color: #fff; }
  .step-label { font-size: 13px; font-weight: 500; color: #475569; margin-left: 8px; transition: color 0.3s; }
  .step-label.active { color: #e2e8f0; }
  .step-line { width: 40px; height: 1.5px; margin: 0 12px; background: #334155; border-radius: 1px; transition: background 0.3s; }
  .step-line.active { background: #3b82f6; }

  /* Card */
  .card {
    background: #1e293b; border-radius: 20px; border: 1px solid #334155;
    overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    animation: fadeUp 0.4s ease-out;
  }
  .card-inner { padding: 32px; }

  /* Settings bar */
  .settings-bar {
    display: flex; align-items: center; gap: 8px; padding: 16px 24px;
    border-bottom: 1px solid #334155; background: #0f172a;
  }
  .settings-bar label { font-size: 12px; font-weight: 600; color: #64748b; white-space: nowrap; }
  .api-input {
    flex: 1; padding: 7px 12px; background: #1e293b; border: 1.5px solid #334155;
    border-radius: 8px; color: #e2e8f0; font-size: 13px; font-family: inherit; outline: none;
  }
  .api-input:focus { border-color: #3b82f6; }
  .api-input::placeholder { color: #475569; }
  .key-status { font-size: 16px; flex-shrink: 0; }

  /* Drop zone */
  .dropzone {
    border: 2px dashed #334155; border-radius: 16px; padding: 48px 24px;
    text-align: center; cursor: pointer; background: #0f172a; transition: border-color 0.2s, background 0.2s;
  }
  .dropzone:hover, .dropzone.drag-over { border-color: #3b82f6; }
  .dropzone-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.7; }
  .dropzone h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .dropzone p { font-size: 13px; color: #64748b; }
  .dropzone img { max-width: 100%; max-height: 220px; border-radius: 10px; object-fit: contain; }

  /* Extracting */
  .extracting { padding: 64px 32px; text-align: center; }
  .extracting img {
    max-width: 80%; max-height: 160px; border-radius: 10px; object-fit: contain;
    margin-bottom: 24px; opacity: 0.6; animation: pulse 1.5s ease-in-out infinite;
  }
  .extracting-label { display: flex; align-items: center; justify-content: center; gap: 10px; color: #94a3b8; font-size: 14px; font-weight: 500; }
  .spinner { animation: spin 0.8s linear infinite; }

  /* Form */
  .preview-img { display: flex; justify-content: center; padding: 20px 20px 0; }
  .preview-img img { max-width: 100%; max-height: 140px; border-radius: 10px; object-fit: contain; opacity: 0.85; }
  .form-area { padding: 20px 24px 28px; animation: fadeUp 0.35s ease-out; }
  .form-heading { font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 500; color: #94a3b8; display: block; margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 10px 14px; background: #0f172a; border: 1.5px solid #334155;
    border-radius: 10px; color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: #3b82f6; }
  .field input::placeholder { color: #475569; }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    padding: 12px 0; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; text-align: center; border: none; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn-ghost { flex: 1; background: transparent; color: #94a3b8; border: 1.5px solid #334155; }
  .btn-primary {
    flex: 2; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }
  .btn-full { width: 100%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; }

  /* Result */
  .result { padding: 40px 28px; text-align: center; animation: fadeUp 0.35s ease-out; }
  .result-icon {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff;
  }
  .result-icon.ok { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .result-icon.err { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .result h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .result-log {
    font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px;
    max-height: 180px; overflow-y: auto; text-align: left;
    background: #0f172a; border-radius: 10px; padding: 16px;
    white-space: pre-wrap; word-break: break-word;
  }
  .summary-card {
    background: #0f172a; border-radius: 12px; padding: 16px; text-align: left;
    margin-bottom: 20px; border: 1px solid #334155;
  }
  .summary-card .heading { font-size: 12px; color: #64748b; margin-bottom: 8px; font-weight: 600; }
  .summary-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1e293b; }
  .summary-row .lbl { font-size: 12px; color: #64748b; }
  .summary-row .val { font-size: 13px; color: #e2e8f0; font-weight: 500; }

  .error-toast {
    margin-top: 16px; padding: 12px 16px; border-radius: 12px;
    background: #7f1d1d; border: 1px solid #991b1b;
    font-size: 13px; color: #fca5a5; text-align: center; animation: fadeUp 0.3s ease-out;
  }
  .footer { text-align: center; font-size: 11px; color: #475569; margin-top: 24px; line-height: 1.6; }

  /* MCP config */
  .mcp-toggle {
    padding: 12px 24px; border-top: 1px solid #334155; background: #0f172a;
  }
  .mcp-toggle summary {
    font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  .mcp-toggle summary::before { content: "⚙️"; }
  .mcp-toggle .mcp-field { margin-top: 10px; }
  .mcp-toggle .mcp-field label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
  .mcp-toggle .mcp-field input {
    width: 100%; padding: 7px 10px; background: #1e293b; border: 1px solid #334155;
    border-radius: 6px; color: #e2e8f0; font-size: 12px; font-family: monospace; outline: none;
  }
  .mcp-toggle .mcp-field input:focus { border-color: #3b82f6; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-icon">📇</div>
    <h1>CardSync</h1>
    <p>Scan a business card → push to Salesforce</p>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card">
    <!-- API Key -->
    <div class="settings-bar">
      <label>API Key</label>
      <input class="api-input" id="apiKey" type="password" placeholder="sk-ant-…" />
      <span class="key-status" id="keyStatus">🔒</span>
    </div>

    <!-- Steps render here -->
    <div id="stage"></div>

    <!-- MCP config -->
    <div class="mcp-toggle">
      <details>
        <summary>Salesforce MCP endpoint</summary>
        <div class="mcp-field">
          <label>MCP Server Name</label>
          <input id="mcpName" value="salesforce-sobject-all" />
        </div>
        <div class="mcp-field" style="margin-top:6px">
          <label>MCP Server URL</label>
          <input id="mcpUrl" value="https://api.salesforce.com/platform/mcp/v1/platform/sobject-all" />
        </div>
      </details>
    </div>
  </div>

  <div id="errorSlot"></div>
  <p class="footer">Powered by Claude AI · Syncs to Salesforce via MCP</p>
</div>

<script>
const STEPS = ["Scan", "Review", "Upload"];
let currentStep = 0;
let imageData = null;   // { base64, mediaType, preview }
let fields = { firstName: "", lastName: "", title: "", company: "", phone: "", email: "" };
let uploadResult = null;

const fieldMeta = [
  { key: "firstName", label: "First Name", icon: "👤", type: "text" },
  { key: "lastName",  label: "Last Name",  icon: "👤", type: "text" },
  { key: "title",     label: "Title",      icon: "💼", type: "text" },
  { key: "company",   label: "Company",    icon: "🏢", type: "text" },
  { key: "phone",     label: "Phone",      icon: "📞", type: "tel" },
  { key: "email",     label: "Email",      icon: "✉️", type: "email" },
];

function getApiKey() { return document.getElementById("apiKey").value.trim(); }
function getMcp() {
  const name = document.getElementById("mcpName").value.trim();
  const url  = document.getElementById("mcpUrl").value.trim();
  return (name && url) ? { name, url } : null;
}

/* ── Rendering ─────────────────────────────────── */

function renderProgress() {
  const el = document.getElementById("progress");
  el.innerHTML = STEPS.map((s, i) => {
    const active = i <= currentStep;
    const dot = i < currentStep ? "✓" : i + 1;
    return `
      <div class="step-group">
        <div class="step-dot ${active ? "active" : ""}">${dot}</div>
        <span class="step-label ${active ? "active" : ""}">${s}</span>
      </div>
      ${i < STEPS.length - 1 ? `<div class="step-line ${i < currentStep ? "active" : ""}"></div>` : ""}
    `;
  }).join("");
}

function spinnerSVG() {
  return `<svg class="spinner" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="40 20" stroke-linecap="round"/></svg>`;
}

function showError(msg) {
  document.getElementById("errorSlot").innerHTML = msg
    ? `<div class="error-toast">${msg}</div>` : "";
}

function renderStage() {
  renderProgress();
  const stage = document.getElementById("stage");

  // key indicator
  document.getElementById("keyStatus").textContent = getApiKey() ? "🟢" : "🔒";

  if (currentStep === 0) {
    stage.innerHTML = `
      <div class="card-inner">
        <div class="dropzone" id="dropzone">
          ${imageData
            ? `<img src="${imageData.preview}" alt="Card" />`
            : `<div class="dropzone-icon">📷</div>
               <h3>Drop a business card image here</h3>
               <p>or tap to browse — PNG, JPG, HEIC</p>`
          }
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" />
      </div>`;
    const dz = document.getElementById("dropzone");
    const fi = document.getElementById("fileInput");
    dz.addEventListener("click", () => fi.click());
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag-over"); handleFile(e.dataTransfer.files[0]); });
    fi.addEventListener("change", () => { if (fi.files[0]) handleFile(fi.files[0]); });
    return;
  }

  if (currentStep === 1) {
    stage.innerHTML = `
      ${imageData ? `<div class="preview-img"><img src="${imageData.preview}" alt="Scanned"/></div>` : ""}
      <div class="form-area">
        <p class="form-heading">Verify extracted fields</p>
        ${fieldMeta.map(f => `
          <div class="field">
            <label>${f.icon} ${f.label}</label>
            <input type="${f.type}" id="f_${f.key}" value="${escHtml(fields[f.key])}" placeholder="Enter ${f.label.toLowerCase()}" />
          </div>`).join("")}
        <div class="btn-row">
          <button class="btn btn-ghost" id="btnRescan">Rescan</button>
          <button class="btn btn-primary" id="btnPush" ${!fields.lastName ? "disabled" : ""}>Push to Salesforce ☁️</button>
        </div>
      </div>`;
    fieldMeta.forEach(f => {
      document.getElementById(`f_${f.key}`).addEventListener("input", e => {
        fields[f.key] = e.target.value;
        document.getElementById("btnPush").disabled = !fields.lastName;
      });
    });
    document.getElementById("btnRescan").addEventListener("click", reset);
    document.getElementById("btnPush").addEventListener("click", pushToSalesforce);
    return;
  }

  if (currentStep === 2) {
    const ok = uploadResult?.success;
    stage.innerHTML = `
      <div class="result">
        <div class="result-icon ${ok ? "ok" : "err"}">${ok ? "✓" : "✕"}</div>
        <h2>${ok ? "Contact synced" : "Upload issue"}</h2>
        <div class="result-log">${escHtml(uploadResult?.message || "")}</div>
        <div class="summary-card">
          <p class="heading">CONTACT DETAILS</p>
          ${fieldMeta.filter(f => fields[f.key]).map(f => `
            <div class="summary-row">
              <span class="lbl">${f.label}</span>
              <span class="val">${escHtml(fields[f.key])}</span>
            </div>`).join("")}
        </div>
        <button class="btn btn-full" id="btnAgain">Scan another card</button>
      </div>`;
    document.getElementById("btnAgain").addEventListener("click", reset);
  }
}

function showExtracting() {
  document.getElementById("stage").innerHTML = `
    <div class="extracting">
      ${imageData ? `<img src="${imageData.preview}" alt="Scanning"/>` : ""}
      <div class="extracting-label">${spinnerSVG()} Reading card with AI…</div>
    </div>`;
}

function showUploading() {
  const btn = document.getElementById("btnPush");
  if (btn) { btn.disabled = true; btn.innerHTML = spinnerSVG() + " Pushing to Salesforce…"; }
}

function escHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ── Logic ─────────────────────────────────────── */

function reset() {
  currentStep = 0; imageData = null;
  fields = { firstName: "", lastName: "", title: "", company: "", phone: "", email: "" };
  uploadResult = null; showError(""); renderStage();
}

function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) { showError("Please upload an image file."); return; }
  showError("");
  const reader = new FileReader();
  reader.onload = e => {
    const preview = e.target.result;
    const base64 = preview.split(",")[1];
    imageData = { base64, mediaType: file.type, preview };
    extractFields();
  };
  reader.readAsDataURL(file);
}

async function extractFields() {
  const key = getApiKey();
  if (!key) { showError("Enter your Anthropic API key above before scanning."); return; }
  showExtracting(); showError("");

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: imageData.mediaType, data: imageData.base64 } },
            { type: "text", text: 'Extract these fields from this business card image. Return ONLY a JSON object with these exact keys, no markdown, no backticks, no extra text:\n{"firstName":"","lastName":"","title":"","company":"","phone":"","email":""}\nIf a field is not found leave it as an empty string. "title" means job title (e.g. CEO, VP of Sales, Director). For phone include the country code if visible.' }
          ]
        }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = (data.content || []).map(c => c.text || "").join("");
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    fields = {
      firstName: parsed.firstName || "",
      lastName: parsed.lastName || "",
      title: parsed.title || "",
      company: parsed.company || "",
      phone: parsed.phone || "",
      email: parsed.email || "",
    };
    currentStep = 1; renderStage();
  } catch (err) {
    showError("Extraction failed: " + err.message);
    currentStep = 0; renderStage();
  }
}

async function pushToSalesforce() {
  const key = getApiKey();
  if (!key) { showError("Enter your Anthropic API key."); return; }
  const mcp = getMcp();
  if (!mcp) { showError("Configure the Salesforce MCP endpoint under ⚙️ below."); return; }

  showUploading(); showError("");

  const companyKeyword = fields.company.replace(/[^a-zA-Z0-9 ]/g, "").trim().split(/\s+/).slice(0, 2).join(" ");
  const prompt = `Sync a Contact to Salesforce with these details:
- First Name: ${fields.firstName}
- Last Name: ${fields.lastName}
- Title: ${fields.title}
- Account (Company): ${fields.company}
- Phone: ${fields.phone}
- Email: ${fields.email}

IMPORTANT — follow these steps in order:

1. FUZZY ACCOUNT SEARCH: Use the "find" tool (SOSL) to search for Accounts matching "${companyKeyword}". This handles typos, abbreviations, and case differences. If SOSL returns nothing, use SOQL: SELECT Id, Name FROM Account WHERE Name LIKE '%${companyKeyword}%' LIMIT 5

2. MATCH DECISION: If one or more Accounts come back, pick the one whose name is closest to "${fields.company}" and use its Id.

3. NO MATCH: If nothing comes back, create a new Account named "${fields.company}".

4. CHECK FOR EXISTING CONTACT: Before creating, search for an existing Contact: SELECT Id, FirstName, LastName, Title, Phone, Email FROM Contact WHERE FirstName = '${fields.firstName}' AND LastName = '${fields.lastName}' AND AccountId = '<AccountId from step 2 or 3>' LIMIT 1

5a. IF CONTACT EXISTS: Update the existing Contact with any fields that have changed or are missing (Title, Phone, Email). Use the update tool with the existing Contact Id.

5b. IF NO EXISTING CONTACT: Create a new Contact linked to the AccountId from step 2 or 3. If you get a DUPLICATES_DETECTED error, check the duplicate's AccountId. If it matches the same Account, update that existing Contact. If it's a DIFFERENT Account, this is a different person who happens to share the same name — retry the create with the duplicate rule allowed (the error response includes "allowSave": true, so re-create with the header "Sforce-Auto-Assign: FALSE" or pass the duplicate rule header to force save).

Return whether the Contact was CREATED or UPDATED, the Contact Id, and the Account name used.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [{ type: "url", url: mcp.url, name: mcp.name }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const texts = (data.content || []).filter(c => c.type === "text").map(c => c.text);
    const toolResults = (data.content || []).filter(c => c.type === "mcp_tool_result").map(c => {
      try { return c.content?.[0]?.text || JSON.stringify(c.content); } catch { return ""; }
    });
    const full = [...texts, ...toolResults].filter(Boolean).join("\n");
    uploadResult = { success: true, message: full || "Request sent — check Salesforce for the new Contact." };
  } catch (err) {
    uploadResult = { success: false, message: err.message };
  }
  currentStep = 2; renderStage();
}

/* ── Init ──────────────────────────────────────── */
document.getElementById("apiKey").addEventListener("input", () => {
  document.getElementById("keyStatus").textContent = getApiKey() ? "🟢" : "🔒";
});
renderStage();
</script>
</body>
</html>
